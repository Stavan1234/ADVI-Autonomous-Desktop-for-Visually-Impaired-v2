[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "advi-desktop-agent"
version = "0.4.0"
description = "ADVI — Autonomous Desktop for Visually Impaired"
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "groq>=1.7.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.100.0",
    "google-genai>=2.25.0,<3.0.0",
    "watchdog>=4.0.0",
    "psutil>=7.0.0,<8.0.0",
    "pydantic>=2.0.0",
    "pywinauto>=0.6.8",
    # Imported directly (Word automation via win32com, window/process helpers, the
    # output level meter via comtypes); pywinauto also pulls them in on Windows.
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pyautogui>=0.9.54",
    "websocket-client>=1.8.0",
    "tzdata>=2024.1",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "mcp>=2.2.0,<3.0.0",
    # Browser automation engine (actionability waits, iframe access). Drives the
    # installed Chrome via channel="chrome"; no separate browser download needed.
    "playwright>=1.64.0,<2.0.0",
    "sentence-transformers>=6.1.0,<7.0.0",
    "numpy>=2.0.0",
    # Voice input: microphone capture and local Whisper (includes Silero VAD).
    "sounddevice>=0.5.0",
    "faster-whisper>=1.1.0,<2.0.0",
    # Echo cancellation: WebRTC's audio processing module (AEC3), bundled by LiveKit.
    "livekit>=1.1.21,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0,<2.0",
]

[project.scripts]
advi = "advi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
advi = ["fallback/prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests/current"]
asyncio_default_fixture_loop_scope = "function"
